name: Audit localized alphabet web branch

on:
  push:
    branches:
      - build/localized-alphabet-v2
    paths:
      - scripts/audit-localized-alphabet-web.py
      - scripts/audit-localized-alphabet-web-final.py
      - .github/workflows/audit-localized-alphabet-web.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPECTED_FEATURE_HEAD: dcef9100affbba6d2fe25983271ef7ff3e8ed3c9

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout audit tooling
        uses: actions/checkout@v4
        with:
          ref: build/localized-alphabet-v2
          path: tooling

      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/localized-alphabet-navigation
          fetch-depth: 0
          path: source

      - name: Verify remote feature head
        working-directory: source
        run: |
          REMOTE_HEAD=$(git ls-remote origin refs/heads/feature/localized-alphabet-navigation | cut -f1)
          test "$REMOTE_HEAD" = "$EXPECTED_FEATURE_HEAD" || {
            echo "Feature branch moved unexpectedly: $REMOTE_HEAD"
            exit 1
          }

      - name: Rebase on current upstream master
        working-directory: source
        run: |
          git config user.name "kostazol"
          git config user.email "kottik06@gmail.com"
          git remote add upstream https://github.com/jellyfin/jellyfin-web.git
          git fetch upstream master
          git rebase upstream/master

      - name: Apply audit fixes
        working-directory: source
        run: |
          python3 ../tooling/scripts/audit-localized-alphabet-web.py .
          python3 ../tooling/scripts/audit-localized-alphabet-web-final.py .
          git diff --check

      - name: Verify localization scope
        working-directory: source
        run: |
          CHANGED_TRANSLATIONS=$(git diff --name-only upstream/master -- src/strings | grep -v '^src/strings/en-us.json$' || true)
          if [ -n "$CHANGED_TRANSLATIONS" ]; then
            echo "Unexpected non-source translation changes:"
            echo "$CHANGED_TRANSLATIONS"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: source/.nvmrc
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci --no-audit

      - name: Rewrite feature history into reviewable commits
        working-directory: source
        run: |
          git reset --mixed upstream/master

          git add \
            src/apps/modern/features/libraries/components/AlphabetPicker.tsx \
            src/apps/modern/features/libraries/components/GenresItemsContainer.tsx \
            src/apps/modern/features/libraries/components/ItemsView.tsx \
            src/apps/modern/features/libraries/hooks/api/useGenres.ts \
            src/apps/modern/features/libraries/utils/alphabet.ts \
            src/hooks/useFetchItems.ts
          git commit -m "Add localized alphabet navigation"

          git add \
            src/apps/dashboard/routes/settings/index.tsx \
            src/strings/en-us.json
          git commit -m "Add localized alphabet navigation settings"

          git add src/apps/modern/features/libraries/utils/alphabet.test.ts
          git commit -m "Test localized alphabet navigation"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Uncommitted or unstaged feature changes remain:"
            git status --short
            exit 1
          fi
          git diff --check upstream/master..HEAD

      - name: Verify every feature commit type-checks
        working-directory: source
        run: |
          FEATURE_BRANCH=$(git branch --show-current)
          for COMMIT in $(git rev-list --reverse upstream/master..HEAD); do
            echo "Type-checking $COMMIT $(git show -s --format=%s $COMMIT)"
            git checkout --detach "$COMMIT"
            npm run build:check
          done
          git checkout "$FEATURE_BRANCH"

      - name: Lint
        working-directory: source
        run: npm run lint

      - name: Stylelint
        working-directory: source
        run: npm run stylelint

      - name: Type check
        working-directory: source
        run: npm run build:check

      - name: Localized alphabet unit tests
        working-directory: source
        run: npx vitest run src/apps/modern/features/libraries/utils/alphabet.test.ts

      - name: Unit tests
        working-directory: source
        run: npm run test

      - name: Production build and browser syntax check
        working-directory: source
        run: npm run build:es-check

      - name: Verify final author and commit structure
        working-directory: source
        run: |
          git log --format=fuller upstream/master..HEAD
          test "$(git rev-list --count upstream/master..HEAD)" -eq 3
          test -z "$(git log --format='%an <%ae>%n%cn <%ce>' upstream/master..HEAD | grep -v '^kostazol <kottik06@gmail.com>$' || true)"
          test -z "$(git log --format='%s' upstream/master..HEAD | grep -E '^(feat|fix|chore|refactor|test|style|ci)(\(.+\))?:' || true)"

      - name: Publish audited feature history
        working-directory: source
        run: |
          REMOTE_HEAD=$(git ls-remote origin refs/heads/feature/localized-alphabet-navigation | cut -f1)
          test "$REMOTE_HEAD" = "$EXPECTED_FEATURE_HEAD" || {
            echo "Feature branch changed while validation was running: $REMOTE_HEAD"
            exit 1
          }
          git push --force-with-lease=refs/heads/feature/localized-alphabet-navigation:$EXPECTED_FEATURE_HEAD origin HEAD:feature/localized-alphabet-navigation
